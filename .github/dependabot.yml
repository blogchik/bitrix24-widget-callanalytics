# Dependabot, aimed at `dev`.
#
# Every update opens against `dev`, never `main`: `main` is the deployment branch and the
# only way onto it is a reviewed pull request whose CI was green. A bot opening a PR
# straight against the deployment branch would be a second door into production.
#
# Grouping is the point of this file. Thirty open alerts on this repository were fifteen
# advisories against one package, and thirty separate pull requests would have been
# thirty separate CI runs to review the same upgrade. One PR per ecosystem per week, with
# security fixes allowed to jump the queue on their own.

version: 2

updates:
  # --- the frontend ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Next and React move together and are never worth reviewing apart: a React bump
      # without the matching Next bump is a PR that cannot pass CI.
      next:
        patterns: ['next', 'next-intl', 'react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['typescript', 'tailwindcss', 'postcss', 'autoprefixer', '@types/node']
    ignore:
      # A framework major is a project decision with its own verification pass - the UI
      # is measured against this one at four viewport widths - not something to review at
      # 04:00 on a Monday. Security fixes are exempt: Dependabot always raises those.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      # Added after the first weekly batch arrived. Grouped with the other tooling, a
      # Tailwind or TypeScript major produces one pull request that can never be merged
      # as it stands and is re-opened every Monday. Tailwind 4 replaces the JavaScript
      # config with a CSS-first one and moves the PostCSS plugin, which would silently
      # restyle a UI that is measured at four viewport widths; TypeScript 7 is the native
      # port. Each is worth adopting, each on its own, deliberately.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # `@types/node`'s major IS a Node major. It has to match the runtime in
      # `web/Dockerfile`, not lead it: types describing Node 26 on a Node 24 runtime let
      # `tsc` accept calls to APIs that will not be there. It moves when the base image
      # moves, in the same commit.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # --- the API -----------------------------------------------------------------------
  # `pyproject.toml` already carries deliberate upper bounds ("a surprise major of
  # SQLAlchemy, pydantic or httpx must be an explicit decision"), so Dependabot can only
  # propose what those bounds allow, which is exactly the intent.
  - package-ecosystem: pip
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python:
        patterns: ['*']

  # --- base images -------------------------------------------------------------------
  # The two Dockerfiles pin `node:22-alpine` and a python base. A base image is where
  # most of a container's CVE surface lives and it is the easiest thing in the project to
  # forget, because nothing fails when it goes stale.
  - package-ecosystem: docker
    directories:
      - /api
      - /web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tashkent
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Dependabot offers the newest tag; these images track an LTS line instead, which
      # is a different thing and one it cannot see. It proposed `node:26-alpine` while
      # `node:lts-alpine` was still 24, and `python:3.14-slim`, on which `asyncpg` has no
      # wheel - so pip falls back to compiling and the slim image has no compiler.
      # Minor and patch updates of the pinned line are still wanted; the major is a
      # decision about which support window we are on.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: python
        update-types: ['version-update:semver-major']

  # --- the workflows themselves ------------------------------------------------------
  # Every action in .github/workflows is pinned to a commit sha, which is the right thing
  # to do and also means nothing updates them by itself. This is what unpins them safely:
  # Dependabot rewrites the sha AND the trailing `# v7.0.1` comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tashkent
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
