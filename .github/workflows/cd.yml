# CD: publish the images, then put them on the one production host.
#
# `main` is the deployment branch and nothing else. Development happens on `dev`, `main`
# is reached only through a reviewed pull request whose CI was green, and a push to it is
# what starts this workflow. There is no other path to production: the deploy key on the
# server accepts three commands and no shell, so a human with SSH can still break glass
# but a human with a laptop cannot quietly ship a build nobody saw.
#
# Two properties are worth reading before changing anything here:
#
#  * **The image is built once, here, and never on the server.** The host is shared
#     production - two cores, 3.7 GiB, five other projects, three of them PostgreSQL -
#     and a `docker compose build` there costs both cores and 2-4 GiB of disk while the
#     neighbours are serving. The runner builds, GHCR stores, the host pulls.
#  * **The `production` environment gates the second job.** The first job may publish an
#     image freely; nothing reaches the host until a reviewer approves the deployment.
#     That is the last cheap moment to say no.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (40 hex chars). Blank = the tip of main.'
        required: false
        type: string

concurrency:
  # NOT cancel-in-progress. Cancelling a deploy half way through leaves the host with
  # some services on the new image and some on the old, which is the one state nothing
  # here knows how to reason about.
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Resolve the commit being shipped
        id: target
        # The full 40-character sha, resolved from the checkout rather than taken from
        # the input, so the tag on the image is provably the tree that was built.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Repo root, not `api/`: the image carries the shared i18n bundle from
          # `web/messages` and the ingress snippet, and `context: ./api` resolves neither.
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/callanalytics-api:${{ steps.target.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/callanalytics-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: false

      - name: Build and push the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/callanalytics-web:${{ steps.target.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/callanalytics-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: false

      - name: Scan the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/callanalytics-api:${{ steps.target.outputs.sha }}
          format: sarif
          output: trivy-api.sarif
          # `ignore-unfixed`: a CVE with no released fix is information, not a decision.
          # It still reaches the Security tab through the SARIF upload below; what it
          # does not do is block a deployment on something nobody can act on.
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan the web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/callanalytics-web:${{ steps.target.outputs.sha }}
          format: sarif
          output: trivy-web.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # One upload per file, each with its own category. A single upload pointed at the
      # directory concatenates two SARIF runs under one category, which code scanning
      # rejects outright - it cannot tell which findings belong to which image, so it
      # refuses rather than silently merging two inventories.
      - name: Report the API scan to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Report the web scan to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Fail on a fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/callanalytics-api:${{ steps.target.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://b24.texnobus.uz
    steps:
      - name: Authorise the runner against the host
        env:
          # Through the environment, never interpolated into the script body: a secret
          # spliced into a shell line is a shell injection waiting for a value with a
          # quote in it, and `${{ }}` substitution happens before the shell ever sees it.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not `StrictHostKeyChecking=no`: accepting whatever answers
          # on port 22 is accepting a machine-in-the-middle, and this session carries a
          # command that restarts production.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.publish.outputs.sha }}
        # The key on the host carries `command="/usr/local/bin/callanalytics-deploy"`,
        # so this string arrives as SSH_ORIGINAL_COMMAND and anything the script does not
        # recognise is refused. There is no shell at the other end of this.
        run: ssh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" "deploy $SHA"

      - name: Confirm the host is serving the commit we just shipped
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.publish.outputs.sha }}
        # `deploy` already verified health from inside the network. This asserts the
        # thing it cannot: that what came up is the tag we asked for, and not the tag
        # that happened to be there when a pull silently failed.
        run: |
          set -euo pipefail
          state=$(ssh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" "status")
          printf '%s\n' "$state"
          case "$state" in
            *"$SHA"*) echo "host is on $SHA" ;;
            *) echo "::error::the host is not running $SHA"; exit 1 ;;
          esac

      - name: Smoke-test the public URL
        # From outside, through Cloudflare and the tunnel, because that is the path a
        # portal takes. `/settings` is the one worth keeping: routing it to the API
        # instead of the SPA returned raw JSON inside the iframe once, and a moderator
        # would have seen it before we did.
        #
        # Every check captures the response and matches it with `case`, with no pipe
        # anywhere. `curl ... | grep -q` looks obvious and is a trap: `grep -q` exits the
        # moment it matches, the pipe closes under curl, curl dies with exit 23 ("failed
        # writing body"), and `pipefail` makes that the exit code of the whole step. The
        # first run of this pipeline failed exactly that way against a perfectly healthy
        # deployment, and then tried to roll it back.
        run: |
          set -euo pipefail
          base=https://b24.texnobus.uz

          health=$(curl -fsS --max-time 20 "$base/healthz")
          case "$health" in
            *'"status":"ok"'*) ;;
            *) echo "::error::/healthz answered: $health"; exit 1 ;;
          esac

          code=$(curl -fsS --max-time 20 -o /dev/null -w '%{http_code}' "$base/")
          [ "$code" = "200" ] || { echo "::error::the SPA answered $code"; exit 1; }

          headers=$(curl -fsSI --max-time 20 "$base/")
          case "$headers" in
            *[Xx]-[Ff]rame-[Oo]ptions*)
              echo '::error::X-Frame-Options is back; every portal iframe is now broken'
              exit 1 ;;
          esac

          # The path a moderator walks. It must reach the SPA and return HTML; routing it
          # to the API returns JSON, which renders as a raw error inside the iframe.
          settings=$(curl -fsS --max-time 20 "$base/settings?DOMAIN=x.bitrix24.kz&PROTOCOL=1")
          case "$settings" in
            '<!DOCTYPE html>'*) ;;
            *) echo "::error::/settings did not return HTML: ${settings:0:120}"; exit 1 ;;
          esac

          echo 'smoke test passed'

      - name: Roll back
        if: failure()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        # Images are tagged, so this is a tag change and needs no build: it is the one
        # recovery here that costs no CPU and no disk on a host shared with five other
        # projects.
        #
        # A rollback that itself fails must not look like a rollback that worked. The
        # host refuses to roll back to a tag that is not in the registry rather than
        # half-applying one, so the previous release is still running - but nobody should
        # have to read the log to find that out.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" "rollback"; then
            echo '::error::deployment failed and was rolled back to the previous image tag'
          else
            echo '::error::deployment failed AND the rollback did not run. The host refused'
            echo '::error::it rather than half-applying it, so the previous release should'
            echo '::error::still be serving - but verify by hand before doing anything else:'
            echo '::error::  ssh <host> status   and   curl https://b24.texnobus.uz/healthz'
            exit 1
          fi

      - name: What is running now
        if: always()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" "status"
