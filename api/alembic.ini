# Alembic configuration.  There is deliberately NO sqlalchemy.url here:
# alembic/env.py reads settings.database_url_migrations (the ca_owner psycopg URL)
# so migrations always run as the object owner and a credential never sits in a
# file that is committed (docs/architecture.md §3).

[alembic]
script_location = alembic

# Makes `import app.db.models` work when alembic is invoked from /app.
prepend_sys_path = .

# 0001_baseline.py, 0002_....py - readable and sortable in a diff.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are written in UTC.
timezone = UTC

[post_write_hooks]
# none: `make fmt` formats the whole tree, generated revisions included.

# ---------------------------------------------------------------- logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
