# Development overrides: layered on top of docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# (that is what the Makefile does).  Sources are bind-mounted so both servers
# hot-reload; images still come from the same Dockerfiles as production.

services:
  postgres:
    # Loopback only, so psql/DBeaver on the host can connect while nothing is exposed.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    volumes:
      - ./api:/app
      # `./api:/app` hides everything the image put under /app, including the shared
      # i18n bundle the Dockerfile copies to /app/i18n (§8). Without these two the
      # server-rendered install/state/error pages fall back to message keys and every
      # state looks like a generic error. Mounting the source of truth read-only keeps
      # the dev container reading exactly what the image ships.
      - ./web/messages:/app/i18n/messages:ro
      - ./web/src/i18n/locales.json:/app/i18n/locales.json:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      LOG_LEVEL: DEBUG

  worker:
    volumes:
      - ./api:/app
      # `./api:/app` hides everything the image put under /app, including the shared
      # i18n bundle the Dockerfile copies to /app/i18n (§8). Without these two the
      # server-rendered install/state/error pages fall back to message keys and every
      # state looks like a generic error. Mounting the source of truth read-only keeps
      # the dev container reading exactly what the image ships.
      - ./web/messages:/app/i18n/messages:ro
      - ./web/src/i18n/locales.json:/app/i18n/locales.json:ro
    environment:
      LOG_LEVEL: DEBUG

  web:
    # `next dev` needs the full dependency tree, which the production runner stage
    # strips out, so development stops at the `build` stage of web/Dockerfile.
    build:
      context: ./web
      target: build
    image: callanalytics-web:dev
    volumes:
      - ./web:/app
      # Keep the image's installed dependencies and build output; the bind mount
      # above would otherwise hide them behind the (empty) host directories.
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]

  # `docker compose --profile test run --rm test` (see `make test`).
  # Same image, same postgres; conftest.py owns schema setup and the two roles.
  test:
    profiles: ["test"]
    # Repo-root context, like the api service: the image carries the i18n bundle and
    # the ingress snippet, and `build: ./api` would resolve neither.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: callanalytics-api:local
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      # `./api:/app` hides everything the image put under /app, including the shared
      # i18n bundle the Dockerfile copies to /app/i18n (§8). Without these two the
      # server-rendered install/state/error pages fall back to message keys and every
      # state looks like a generic error. Mounting the source of truth read-only keeps
      # the dev container reading exactly what the image ships.
      - ./web/messages:/app/i18n/messages:ro
      - ./web/src/i18n/locales.json:/app/i18n/locales.json:ro
      # tests/test_routing.py parses the ingress snippet to assert which upstream each
      # path resolves to - the regression guard for the /settings routing blocker.
      - ./docker:/docker:ro
    command: ["pytest", "-q"]
